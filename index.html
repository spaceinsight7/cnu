<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>랜덤 조 편성</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --ink:#0f1c2e; --muted:#5b6b82; --card:#ffffff; --line:#dbe4f0;
    --accent:#1d5fd1; --accent-soft:#e3edfd; --green:#1e7a9a; --green-soft:#dff2f8;
    --g1:#e6f0ff;--g2:#dff3fb;--g3:#e3e9fb;--g4:#d9eefa;--g5:#e9f3ff;--g6:#dde8f8;--g7:#e1f4f4;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.5}
  .wrap{max-width:1040px;margin:0 auto;padding:32px 20px 80px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
  h1{font-size:30px;font-weight:900;margin:0;letter-spacing:-.02em}
  h1 small{display:block;font-size:14px;font-weight:500;color:var(--muted);margin-top:4px}
  .steps{display:flex;gap:8px;flex-wrap:wrap}
  .step{padding:6px 12px;border-radius:999px;background:#eef3fa;color:var(--muted);font-size:13px;font-weight:700}
  .step.on{background:var(--ink);color:#fff}
  .step.done{background:var(--green-soft);color:var(--green)}

  .grid{display:grid;grid-template-columns:300px 1fr;gap:20px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(15,28,46,.04)}
  .panel h2{font-size:15px;margin:0 0 10px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
  .panel h2 span{font-size:12px;color:var(--muted);font-weight:500}
  textarea{width:100%;height:330px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;resize:vertical;background:#f7faff}
  textarea:focus{outline:2px solid var(--accent);border-color:transparent}
  .hint{font-size:12px;color:var(--muted);margin:8px 0 0}
  .opt{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px}
  .opt input{width:56px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;font:inherit;text-align:center}

  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;transition:.15s;font-size:15px}
  button:disabled{opacity:.4;cursor:not-allowed}
  .btn-main{background:var(--accent);color:#fff}
  .btn-main:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(29,95,209,.3)}
  .btn-sub{background:var(--ink);color:#fff}
  .btn-sub:not(:disabled):hover{transform:translateY(-1px)}
  .btn-ghost{background:#eef3fa;color:var(--ink)}
  .btn-ghost:hover{background:#dde7f5}

  /* 깍두기 */
  .kkak{background:linear-gradient(135deg,#f3f8ff,#e3edfd);border:1px dashed #8fb3ee;border-radius:16px;padding:20px;text-align:center;margin-bottom:16px;min-height:120px;display:flex;flex-direction:column;justify-content:center}
  .kkak .label{font-size:13px;color:#1d4fa8;font-weight:700;letter-spacing:.08em}
  .kkak .name{font-size:44px;font-weight:900;color:var(--accent);line-height:1.2;min-height:56px}
  .kkak .name.spin{color:#8fb3ee}
  .kkak .sub{font-size:13px;color:var(--muted)}
  .kkak.empty .name{color:#b9c8e0;font-size:22px;font-weight:500}

  /* 조 카드 */
  .groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .group{border-radius:14px;padding:14px 16px;border:1px solid rgba(29,95,209,.12);opacity:0;transform:translateY(14px);animation:pop .4s forwards}
  @keyframes pop{to{opacity:1;transform:none}}
  .group h3{margin:0 0 8px;font-size:15px;font-weight:900;display:flex;justify-content:space-between}
  .group h3 span{font-size:12px;color:var(--muted);font-weight:500}
  .group ul{list-style:none;margin:0;padding:0}
  .group li{padding:6px 0;border-top:1px solid rgba(29,95,209,.1);font-size:16px;font-weight:500;display:flex;justify-content:space-between}
  .group li small{color:var(--muted);font-weight:400;font-size:12px}
  .slot{display:inline-block;min-width:3em;transition:.15s}
  .slot.spin{color:#8fb3ee;font-weight:400}
  .slot.lock{color:var(--ink);font-weight:700;animation:lockin .3s}
  @keyframes lockin{0%{transform:scale(1.25);color:var(--accent)}100%{transform:scale(1)}}
  .group.done{box-shadow:0 4px 14px rgba(29,95,209,.15);border-color:rgba(29,95,209,.35)}
  .empty-groups{color:var(--muted);font-size:14px;text-align:center;padding:40px 0;border:1px dashed var(--line);border-radius:14px}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>랜덤 조 편성 <small>깍두기 1명 추첨 → 나머지를 3명씩 조 배정</small></h1>
    <div class="steps">
      <div class="step on" id="s1">① 명단 확인</div>
      <div class="step" id="s2">② 깍두기 뽑기</div>
      <div class="step" id="s3">③ 조 배정</div>
    </div>
  </header>

  <div class="grid">
    <aside class="panel">
      <h2>명단 <span id="count"></span></h2>
      <textarea id="roster" spellcheck="false"></textarea>
      <p class="hint">한 줄에 한 명. 이름 뒤에 띄어쓰기로 학년 등 메모를 붙여도 됩니다 (예: <b>고양 4학년</b>). 수정하면 자동 반영됩니다.</p>
      <div class="opt"><label>조당 인원</label><input type="number" id="size" value="3" min="2" max="10"> <label>명</label></div>
      <div class="opt" style="margin-top:6px"><label>깍두기</label><input type="number" id="kcount" value="1" min="0" max="5"> <label>명</label></div>
    </aside>

    <main>
      <div class="actions">
        <button class="btn-main" id="btnKkak">🎲 깍두기 뽑기</button>
        <button class="btn-sub" id="btnGroup" disabled>👥 조 배정</button>
        <button class="btn-ghost" id="btnCopy" disabled>📋 결과 복사</button>
        <button class="btn-ghost" id="btnReset">↺ 처음부터</button>
      </div>

      <div class="kkak empty" id="kkakBox">
        <div class="label">깍두기</div>
        <div class="name" id="kkakName">아직 뽑지 않았습니다</div>
        <div class="sub" id="kkakSub"></div>
      </div>

      <div id="groupsArea"><div class="empty-groups">깍두기를 뽑은 뒤 「조 배정」을 누르세요</div></div>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const DEFAULT = `고양
김범진
김지언
김채원
김태경
민홍기
박찬
성건우
성영주
성지현
신유준
염예진
우동민
원준섭
이선우
조성혁
최은성
최지훈
최희정`;

const $ = id => document.getElementById(id);
const roster = $('roster'), count=$('count'), kkakBox=$('kkakBox'), kkakName=$('kkakName'), kkakSub=$('kkakSub');
const groupsArea=$('groupsArea'), btnKkak=$('btnKkak'), btnGroup=$('btnGroup'), btnCopy=$('btnCopy'), btnReset=$('btnReset');

let state = { kkak: [], groups: [], remaining: [] };
roster.value = DEFAULT;

function people(){
  return roster.value.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>{
    const [name, ...rest] = s.split(/\s+/);
    return {name, note: rest.join(' ')};
  });
}
// 암호학적 난수 기반 Fisher–Yates 셔플
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const r = new Uint32Array(1); crypto.getRandomValues(r);
    const j = r[0] % (i+1);
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function updateCount(){
  const n = people().length, k=+$('kcount').value, size=+$('size').value;
  const rem = n - k;
  const full = Math.floor(rem/size), left = rem % size;
  count.textContent = `${n}명 · 깍두기 ${k}명 제외 시 ${rem}명 → ${size}명씩 ${full}개 조` + (left? ` (+${left}명 남음)`:'');
}
roster.addEventListener('input', ()=>{ updateCount(); softReset(); });
$('size').addEventListener('input', updateCount);
$('kcount').addEventListener('input', ()=>{ updateCount(); softReset(); });
updateCount();

function setStep(n){
  ['s1','s2','s3'].forEach((id,i)=>{
    const el=$(id); el.className='step';
    if(i+1<n) el.classList.add('done'); else if(i+1===n) el.classList.add('on');
  });
}

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

/* ① 깍두기 뽑기 (룰렛 애니메이션) */
btnKkak.addEventListener('click', ()=>{
  if(grouping) return;
  const list = people();
  const k = +$('kcount').value;
  if(list.length < k+2){ toast('명단 인원이 너무 적습니다'); return; }
  btnKkak.disabled = true; btnGroup.disabled=true; btnCopy.disabled=true;
  groupsArea.innerHTML = '<div class="empty-groups">깍두기를 뽑은 뒤 「조 배정」을 누르세요</div>';
  kkakBox.classList.remove('empty'); kkakName.classList.add('spin'); kkakSub.textContent='';
  const shuffled = shuffle(list);
  const picked = shuffled.slice(0,k);
  let tick=0, delay=40;
  (function spin(){
    kkakName.textContent = list[Math.floor(Math.random()*list.length)].name;
    tick++;
    if(tick<28){ delay += tick>18? 25:4; setTimeout(spin, delay); }
    else {
      kkakName.classList.remove('spin');
      kkakName.textContent = picked.map(p=>p.name).join(' · ') || '(없음)';
      kkakSub.textContent = picked.map(p=>p.note).filter(Boolean).join(' / ');
      state.kkak = picked; state.remaining = shuffled.slice(k); state.groups=[];
      btnKkak.disabled=false; btnGroup.disabled=false; setStep(3);
    }
  })();
  setStep(2);
});

/* ② 조 배정 (조별로 이름이 돌아가다 멈춤) */
let grouping=false;
btnGroup.addEventListener('click', ()=>{
  if(grouping) return;
  const size = +$('size').value;
  const pool = shuffle(state.remaining);
  const groups=[];
  for(let i=0;i<pool.length;i+=size) groups.push(pool.slice(i,i+size));
  if(groups.length>1 && groups[groups.length-1].length===1){
    const last = groups.pop(); groups[0].push(last[0]);
  }
  state.groups = groups;
  grouping=true; btnGroup.disabled=true; btnKkak.disabled=true; btnCopy.disabled=true;

  // 빈 카드 먼저 그리기
  groupsArea.innerHTML='';
  const wrap=document.createElement('div'); wrap.className='groups';
  const slots=[]; // [{el, person}]
  groups.forEach((g,i)=>{
    const div=document.createElement('div'); div.className='group';
    div.style.background=`var(--g${(i%7)+1})`; div.style.animationDelay=(i*0.06)+'s';
    div.innerHTML=`<h3>${i+1}조 <span>${g.length}명</span></h3><ul>`+
      g.map(()=>`<li><span class="slot spin">?</span></li>`).join('')+'</ul>';
    wrap.appendChild(div);
    div.querySelectorAll('.slot').forEach((el,j)=>slots.push({el, person:g[j], group:div}));
  });
  groupsArea.appendChild(wrap);

  const names = state.remaining.map(p=>p.name);
  const rnd = ()=>names[Math.floor(Math.random()*names.length)];
  let locked=0;
  // 아직 안 정해진 슬롯은 계속 돌아감
  const timer=setInterval(()=>{
    for(let i=locked;i<slots.length;i++) slots[i].el.textContent=rnd();
  }, 60);

  // 한 명씩 순서대로 확정 (처음 0.9초는 전체가 돌아감)
  setTimeout(function lockNext(){
    if(locked>=slots.length){
      clearInterval(timer); grouping=false;
      btnGroup.disabled=false; btnKkak.disabled=false; btnCopy.disabled=false;
      ['s1','s2','s3'].forEach(id=>$(id).className='step done');
      return;
    }
    const s=slots[locked];
    s.el.textContent=s.person.name; s.el.classList.remove('spin'); s.el.classList.add('lock');
    locked++;
    if(locked%Number(size)===0 || locked===slots.length) s.group.classList.add('done');
    setTimeout(lockNext, 220);
  }, 900);
});

function render(){
  groupsArea.innerHTML = '';
  const wrap = document.createElement('div'); wrap.className='groups';
  state.groups.forEach((g,i)=>{
    const div = document.createElement('div'); div.className='group done';
    div.style.background = `var(--g${(i%7)+1})`;
    div.innerHTML = `<h3>${i+1}조 <span>${g.length}명</span></h3><ul>` +
      g.map(p=>`<li><span class="slot lock">${p.name}</span></li>`).join('') + '</ul>';
    wrap.appendChild(div);
  });
  groupsArea.appendChild(wrap);
}

/* 결과 복사 */
btnCopy.addEventListener('click', ()=>{
  let txt = `깍두기: ${state.kkak.map(p=>p.name).join(', ') || '없음'}\n\n`;
  txt += state.groups.map((g,i)=>`${i+1}조: ${g.map(p=>p.name).join(', ')}`).join('\n');
  try{ navigator.clipboard.writeText(txt).then(()=>toast('결과를 복사했습니다'), ()=>fallback(txt)); }
  catch(e){ fallback(txt); }
  function fallback(t){ roster.value = t; toast('복사가 막혀 명단 칸에 결과를 표시했습니다'); }
});

function softReset(){
  state={kkak:[],groups:[],remaining:[]};
  kkakBox.classList.add('empty'); kkakName.textContent='아직 뽑지 않았습니다'; kkakSub.textContent='';
  groupsArea.innerHTML='<div class="empty-groups">깍두기를 뽑은 뒤 「조 배정」을 누르세요</div>';
  btnGroup.disabled=true; btnCopy.disabled=true; setStep(1);
}
btnReset.addEventListener('click', ()=>{ roster.value=DEFAULT; updateCount(); softReset(); });
</script>
</body>
</html>
