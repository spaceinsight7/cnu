<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>발표순서 추첨</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --ink:#0f1c2e; --muted:#5b6b82; --card:#ffffff; --line:#dbe4f0;
    --accent:#1d5fd1; --accent-soft:#e3edfd; --green:#1e7a9a; --green-soft:#dff2f8;
    --g1:#e6f0ff;--g2:#dff3fb;--g3:#e3e9fb;--g4:#d9eefa;--g5:#e9f3ff;--g6:#dde8f8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.5}
  .wrap{max-width:1040px;margin:0 auto;padding:32px 20px 80px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
  h1{font-size:30px;font-weight:900;margin:0;letter-spacing:-.02em}
  h1 small{display:block;font-size:14px;font-weight:500;color:var(--muted);margin-top:4px}
  .steps{display:flex;gap:8px;flex-wrap:wrap}
  .step{padding:6px 12px;border-radius:999px;background:#eef3fa;color:var(--muted);font-size:13px;font-weight:700}
  .step.on{background:var(--ink);color:#fff}
  .step.done{background:var(--green-soft);color:var(--green)}

  .grid{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(15,28,46,.04)}
  .panel h2{font-size:15px;margin:0 0 10px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
  .panel h2 span{font-size:12px;color:var(--muted);font-weight:500}
  .team{padding:10px 0;border-top:1px solid var(--line)}
  .team:first-of-type{border-top:0;padding-top:2px}
  .team-top{display:flex;align-items:center;gap:8px;margin-bottom:2px}
  .team-top b{font-size:16px;font-weight:900}
  .chip{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;white-space:nowrap}
  .team-mem{font-size:14px;color:var(--muted)}
  .team-mem b{color:var(--ink);font-weight:700}
  .team-mem small{font-size:11px;color:var(--green);font-weight:700;margin-left:2px}
  .hint{font-size:12px;color:var(--muted);margin:10px 0 0}

  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;transition:.15s;font-size:15px}
  button:disabled{opacity:.4;cursor:not-allowed}
  .btn-main{background:var(--accent);color:#fff}
  .btn-main:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(29,95,209,.3)}
  .btn-ghost{background:#eef3fa;color:var(--ink)}
  .btn-ghost:not(:disabled):hover{background:#dde7f5}

  /* 결과 요약 */
  .summary{background:linear-gradient(135deg,#f3f8ff,#e3edfd);border:1px dashed #8fb3ee;border-radius:16px;padding:20px;text-align:center;margin-bottom:16px;min-height:120px;display:flex;flex-direction:column;justify-content:center}
  .summary .label{font-size:13px;color:#1d4fa8;font-weight:700;letter-spacing:.08em}
  .summary .line{font-size:30px;font-weight:900;color:var(--accent);line-height:1.4;min-height:42px}
  .summary .line i{font-style:normal;color:#8fb3ee;font-weight:500;margin:0 6px}
  .summary.empty .line{color:#b9c8e0;font-size:22px;font-weight:500}
  .summary .sub{font-size:13px;color:var(--muted)}

  /* 순서 카드 */
  .order{display:flex;flex-direction:column;gap:10px}
  .row{display:grid;grid-template-columns:70px 170px 1fr;align-items:center;gap:14px;border-radius:14px;padding:12px 16px;border:1px solid rgba(29,95,209,.12);opacity:0;transform:translateY(14px);animation:pop .4s forwards}
  @keyframes pop{to{opacity:1;transform:none}}
  .ord{display:flex;align-items:baseline;gap:3px}
  .ord b{font-size:28px;font-weight:900;line-height:1}
  .ord span{font-size:12px;color:var(--muted);font-weight:500}
  .who{display:flex;align-items:center;gap:8px}
  .slot{display:inline-block;min-width:2.2em;font-size:26px;font-weight:900;transition:.15s}
  .slot.wait{color:#b9c8e0;font-weight:500}
  .slot.spin{color:#8fb3ee;font-weight:500}
  .slot.lock{color:var(--ink);animation:lockin .3s}
  @keyframes lockin{0%{transform:scale(1.25);color:var(--accent)}100%{transform:scale(1)}}
  .row .chip{background:#fff}
  .mem{font-size:14px;color:var(--muted)}
  .mem b{color:var(--ink);font-weight:700}
  .row.done{box-shadow:0 4px 14px rgba(29,95,209,.15);border-color:rgba(29,95,209,.35)}
  @media(max-width:560px){
    .row{grid-template-columns:60px 1fr}
    .mem{grid-column:1/-1}
    .summary .line{font-size:22px}
  }

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>발표순서 추첨 <small>1조~6조 발표순서를 무작위로 정합니다</small></h1>
    <div class="steps">
      <div class="step on" id="s1">① 조 확인</div>
      <div class="step" id="s2">② 순서 추첨</div>
    </div>
  </header>

  <div class="grid">
    <aside class="panel">
      <h2>조 편성 <span>6개 조 · 19명</span></h2>
      <div id="teamList"></div>
      <p class="hint">굵은 이름은 조장입니다.</p>
    </aside>

    <main>
      <div class="actions">
        <button class="btn-main" id="btnDraw">🎲 발표순서 추첨</button>
        <button class="btn-ghost" id="btnCopy" disabled>📋 결과 복사</button>
        <button class="btn-ghost" id="btnReset">↺ 처음부터</button>
      </div>

      <div class="summary empty" id="sumBox">
        <div class="label">발표순서</div>
        <div class="line" id="sumLine">아직 추첨하지 않았습니다</div>
        <div class="sub" id="sumSub"></div>
      </div>

      <div class="order" id="orderList"></div>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* 최종 조 편성 */
const TEAMS = [
  {no:1, leader:'김범진', area:'중랑구', members:['고양','김범진','신유준']},
  {no:2, leader:'성지현', area:'성북구', members:['최희정','우동민','성지현','박찬']},
  {no:3, leader:'최지훈', area:'동작구', members:['최지훈','김채원','조성혁']},
  {no:4, leader:'염예진', area:'은평구', members:['원준섭','염예진','이선우']},
  {no:5, leader:'최은성', area:'관악구', members:['성영주','김지언','최은성']},
  {no:6, leader:'김태경', area:'마포구', members:['민홍기','성건우','김태경']}
];

const $ = id => document.getElementById(id);
const teamList=$('teamList'), orderList=$('orderList'), sumBox=$('sumBox'), sumLine=$('sumLine'), sumSub=$('sumSub');
const btnDraw=$('btnDraw'), btnCopy=$('btnCopy'), btnReset=$('btnReset');

let order = [];        // 확정된 발표순서
let drawing = false;
let timers = [];

/* 암호학적 난수 기반 Fisher–Yates 셔플 (치우침 없는 추첨) */
function randInt(n){
  const limit = Math.floor(0x100000000 / n) * n;
  const r = new Uint32Array(1);
  do { crypto.getRandomValues(r); } while (r[0] >= limit);
  return r[0] % n;
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = randInt(i+1);
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function memHTML(t, mark){
  return t.members.map(m => m===t.leader ? `<b>${m}</b>${mark?'<small>조장</small>':''}` : m).join(', ');
}

/* 왼쪽: 조 편성표 */
teamList.innerHTML = TEAMS.map(t =>
  `<div class="team">
     <div class="team-top"><b>${t.no}조</b><span class="chip">${t.area}</span></div>
     <div class="team-mem">${memHTML(t,true)}</div>
   </div>`).join('');

function setStep(n){
  ['s1','s2'].forEach((id,i)=>{
    const el=$(id); el.className='step';
    if(i+1<n) el.classList.add('done'); else if(i+1===n) el.classList.add('on');
  });
}
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

/* 빈 순서 카드 그리기 */
function drawEmptyRows(cls){
  orderList.innerHTML = TEAMS.map((_,i)=>
    `<div class="row" style="background:var(--g${i+1});animation-delay:${i*0.06}s">
       <div class="ord"><b>${i+1}</b><span>번째</span></div>
       <div class="who"><span class="slot ${cls}">?</span><span class="chip" hidden></span></div>
       <div class="mem"></div>
     </div>`).join('');
}

function reset(){
  timers.forEach(t=>{ clearInterval(t); clearTimeout(t); }); timers=[];
  order=[]; drawing=false;
  sumBox.classList.add('empty'); sumLine.textContent='아직 추첨하지 않았습니다'; sumSub.textContent='';
  drawEmptyRows('wait');
  btnDraw.disabled=false; btnCopy.disabled=true; setStep(1);
}

/* 발표순서 추첨: 조 이름이 돌아가다가 1번째부터 차례로 확정 */
btnDraw.addEventListener('click', ()=>{
  if(drawing) return;
  drawing=true; btnDraw.disabled=true; btnCopy.disabled=true; setStep(2);

  const result = shuffle(TEAMS);
  drawEmptyRows('spin');
  const rows = Array.from(orderList.querySelectorAll('.row'));
  sumBox.classList.remove('empty'); sumLine.textContent='추첨 중…'; sumSub.textContent='';

  let locked = 0;
  // 아직 안 정해진 칸은 남은 조 가운데서 계속 돌아감
  const spin = setInterval(()=>{
    const rest = result.slice(locked);
    for(let i=locked;i<rows.length;i++){
      rows[i].querySelector('.slot').textContent = rest[Math.floor(Math.random()*rest.length)].no + '조';
    }
  }, 60);
  timers.push(spin);

  // 처음 0.9초는 전체가 돌아가고, 이후 한 칸씩 확정
  timers.push(setTimeout(function lockNext(){
    if(locked >= rows.length){
      clearInterval(spin); drawing=false; order=result;
      btnCopy.disabled=false;
      sumSub.textContent='다시 뽑으려면 「처음부터」를 누르세요';
      ['s1','s2'].forEach(id=>$(id).className='step done');
      return;
    }
    const t = result[locked], row = rows[locked];
    const slot = row.querySelector('.slot'), chip = row.querySelector('.chip');
    slot.textContent = t.no + '조'; slot.classList.remove('spin'); slot.classList.add('lock');
    chip.textContent = t.area; chip.hidden = false;
    row.querySelector('.mem').innerHTML = memHTML(t,false);
    row.classList.add('done');
    locked++;
    sumLine.innerHTML = result.slice(0,locked).map(x=>x.no+'조').join('<i>→</i>');
    timers.push(setTimeout(lockNext, 550));
  }, 900));
});

/* 결과 복사 */
btnCopy.addEventListener('click', ()=>{
  if(!order.length) return;
  const txt = '발표순서\n' + order.map((t,i)=>`${i+1}번째: ${t.no}조 (${t.area}, 조장 ${t.leader})`).join('\n');
  const ok = ()=>toast('결과를 복사했습니다');
  const fallback = ()=>{
    const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    let done=false; try{ done=document.execCommand('copy'); }catch(e){}
    ta.remove(); toast(done ? '결과를 복사했습니다' : '복사가 막혔습니다. 화면을 직접 캡처해 주세요');
  };
  try{ navigator.clipboard.writeText(txt).then(ok, fallback); }catch(e){ fallback(); }
});

btnReset.addEventListener('click', reset);
reset();
</script>
</body>
</html>
